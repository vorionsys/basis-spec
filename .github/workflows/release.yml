# SPDX-License-Identifier: Apache-2.0
# Stable `latest` release for @vorionsys/* packages in this monorepo, published
# tokenlessly via npm trusted publishing (OIDC) with a Sigstore provenance
# attestation — no NPM_TOKEN is stored anywhere.
#
# Tag pushes (v*) always publish from packages/basis.
# workflow_dispatch lets you target any workspace package by directory name.
#
# Prerequisite: each npm package needs its own trusted publisher binding:
#   npmjs.com -> package Settings -> Publishing access -> GitHub Actions:
#   org vorionsys, repo basis-spec, workflow release.yml, environment blank
#
# Packages + npm names:
#   basis             -> @vorionsys/basis-spec
#   basis-conformance -> @vorionsys/basis-spec-conformance
#   basis-scorer      -> @vorionsys/basis-scorer
#   basis-registry    -> @vorionsys/basis-registry
#   basis-quorum      -> @vorionsys/basis-quorum        (NEW, never published)
#   basis-plan        -> @vorionsys/basis-plan          (NEW, never published)
#   basis-merkle      -> @vorionsys/basis-merkle        (NEW, never published)
#
# FIRST PUBLISH OF A NEW PACKAGE — npm has no "pending publisher" concept.
# The binding above is configured at
#   npmjs.com -> Packages -> YOUR_PACKAGE -> Settings -> Trusted publishing
# which needs a package page, and a never-published package has none. npm's own
# docs are silent on this rather than stating it; the evidence is the config
# path itself, plus the existence of tools whose whole job is publishing a
# placeholder so OIDC can then be configured. PyPI supports pending publishers;
# npm is repeatedly contrasted against it here. Worth re-checking in the npm UI
# before a release, in case it has shipped since.
#
# The bootstrap does NOT cost provenance. Provenance needs a supported CI with
# `id-token: write` — that is what signs the Sigstore attestation — and is
# independent of how you AUTHENTICATE. A granular token in Actions plus
# `npm publish --provenance` is a documented pattern that predates trusted
# publishing. So:
#
#   1. first publish from Actions with a short-lived granular NPM_TOKEN,
#      keeping --provenance
#   2. configure trusted publishing on the now-existing package
#   3. revoke the token; subsequent releases go tokenless via OIDC
#
# Never drop `provenance: true` to get a publish through. It is the attestation
# these packages' entire "verify it yourself" claim rests on, and it was never
# the thing blocking you.
#
# PUBLISH ORDER MATTERS: @vorionsys/basis-spec@1.3.0 must land BEFORE
# basis-quorum / basis-plan / basis-merkle, which all depend on ^1.3.0.
# Publishing them first ships packages whose dependency cannot resolve.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package directory under packages/ to publish
        required: true
        type: choice
        default: basis
        options:
          - basis
          - basis-conformance
          - basis-scorer
          - basis-registry
          - basis-quorum
          - basis-plan
          - basis-merkle

permissions:
  contents: read
  id-token: write   # for npm provenance (tokenless OIDC trusted publishing)

jobs:
  publish:
    name: Build, gate, publish packages/${{ github.event_name == 'workflow_dispatch' && inputs.package || 'basis' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_DIR: packages/${{ github.event_name == 'workflow_dispatch' && inputs.package || 'basis' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install (clean)
        run: npm ci

      - name: Gates (typecheck + build; tests run if present)
        run: |
          npm run build -w packages/basis
          npm run typecheck --workspaces --if-present
          npm run build --workspaces --if-present
          npm run test --workspaces --if-present

      - name: Verify package contents
        run: |
          cd "$PACKAGE_DIR"
          npm pack --dry-run

      - name: Publish (tokenless OIDC, provenance)
        run: |
          cd "$PACKAGE_DIR"
          npm publish --provenance --access public
